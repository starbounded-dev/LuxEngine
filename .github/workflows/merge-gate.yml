name: Merge gate

# Branch protection on dev and master requires the "CI result" job below.
#
# Build LuxEngine (main.yml) deliberately gives a same-repository PR no run of
# its own: the branch's push run reports on the same commit, on the faster
# self-hosted runners. It also skips docs-only changes. A required check that
# lived in main.yml would therefore never report for those PRs and they could
# never merge. This workflow always runs on a PR, finds the Build LuxEngine run
# for the PR's head commit (the push run for a same-repository branch, the PR
# run for a fork), waits for it, and passes only if every build and test job
# in it passed or was skipped by design.

on:
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for Build LuxEngine and check its jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, sys, time, urllib.request

          REPO = os.environ["REPO"]
          SHA = os.environ["HEAD_SHA"]
          SAME_REPO = os.environ["HEAD_REPO"] == REPO
          REF = os.environ["HEAD_REF"]
          TOKEN = os.environ["GH_TOKEN"]

          # Keep in step with main.yml: its paths-ignore, and the branches its push run covers.
          IGNORED = ["docs/**", "specs/**", ".claude/**", ".agents/**", ".specify/**", "*.md"]
          PUSH_BRANCHES = ["master", "dev", "feature/**", "fix/**"]
          # Jobs that decide the result. Linux jobs count when they ran; same-repository PRs skip them by design.
          GATED = ("Build: Windows", "Test: Windows", "Build: Linux", "Test: Linux")
          BAD = {"failure", "cancelled", "timed_out", "action_required", "startup_failure"}
          WAIT_FOR_RUN = 15 * 60       # how long the run may take to appear
          WAIT_FOR_FINISH = 170 * 60   # how long it may take to finish
          POLL = 30

          def api(path):
              items, url = [], f"https://api.github.com/repos/{REPO}/{path}"
              while url:
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urllib.request.urlopen(req) as resp:
                      data = json.load(resp)
                      link = resp.headers.get("Link", "")
                  if isinstance(data, dict) and not any(k in data for k in ("workflow_runs", "jobs")):
                      return data
                  items.extend(data if isinstance(data, list) else data.get("workflow_runs", data.get("jobs", [])))
                  url = next((p.split(";")[0].strip(" <>") for p in link.split(",") if 'rel="next"' in p), None)
              return items

          def matches(path, pattern):
              if pattern.endswith("/**"):
                  return path.startswith(pattern[:-2])
              return "/" not in path and fnmatch.fnmatch(path, pattern)  # "*.md" means top-level only

          files = [f["filename"] for f in api(f"pulls/{os.environ['PR_NUMBER']}/files?per_page=100")]
          if files and all(any(matches(f, p) for p in IGNORED) for f in files):
              print(f"Only files Build LuxEngine ignores changed ({len(files)}): nothing to build. Passing.")
              sys.exit(0)

          if SAME_REPO and not any(REF == b or (b.endswith("/**") and REF.startswith(b[:-2])) for b in PUSH_BRANCHES):
              print(f"::error::Branch '{REF}' gets no Build LuxEngine run. Name it feature/<slug> or fix/<issue>-<slug> "
                    "(see .github/pull_request_template.md), push it again, and reopen this PR.")
              sys.exit(1)

          event = "push" if SAME_REPO else "pull_request"
          print(f"Waiting for the Build LuxEngine {event} run on {SHA[:7]}…")
          start = time.time()
          run = None
          while True:
              runs = api(f"actions/workflows/main.yml/runs?head_sha={SHA}&event={event}&per_page=20")
              run = max(runs, key=lambda r: r["created_at"]) if runs else None
              if run is None:
                  if time.time() - start > WAIT_FOR_RUN:
                      print(f"::error::No Build LuxEngine {event} run appeared for {SHA[:7]} within "
                            f"{WAIT_FOR_RUN // 60} minutes.")
                      sys.exit(1)
              elif run["status"] == "completed":
                  break
              elif time.time() - start > WAIT_FOR_FINISH:
                  print(f"::error::Build LuxEngine run {run['html_url']} hadn't finished after "
                        f"{WAIT_FOR_FINISH // 60} minutes.")
                  sys.exit(1)
              time.sleep(POLL)

          print(f"Build LuxEngine finished: {run['html_url']} ({run['conclusion']})")
          jobs = [j for j in api(f"actions/runs/{run['id']}/jobs?per_page=100") if j["name"].startswith(GATED)]
          failed = [j for j in jobs if j["conclusion"] in BAD]
          built = [j for j in jobs if j["name"].startswith("Build: Windows (") and j["conclusion"] == "success"]

          for j in sorted(jobs, key=lambda j: j["name"]):
              print(f"  {j['conclusion'] or j['status']:>9}  {j['name']}")
          if failed:
              for j in failed:
                  print(f"::error::{j['name']} {j['conclusion']}: {j['html_url']}")
              sys.exit(1)
          if not built:
              print("::error::No Windows build ran to success in that run, so there is nothing to vouch for.")
              sys.exit(1)
          print(f"All {len(jobs)} build and test jobs passed or were skipped by design.")
          PY
