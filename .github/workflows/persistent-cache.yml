name: Persistent build cache checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - '.github/workflows/persistent-cache.yml'
      - 'Core/Source/lpch.h'
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'tests/ci/**'
      - '.github/workflows/persistent-cache.yml'
      - 'Core/Source/lpch.h'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/ci -v
      - run: python tests/ci/benchmark_incremental.py
