name: Build LuxEngine

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
      - 'features/**' # Glob pattern for any branch starting with 'features/'
  pull_request:
    branches:
      - master
      - dev

env:
  GITHUB_WORKSPACE: ${{ github.workspace }}
  SOLUTION_FILE_PATH: Lux.sln
  BUILD_PLATFORM: Mixed Platforms
  PREMAKE_GENERATOR: vs2022

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          lfs: true

      # Private dependencies are fetched separately. Each token has read-only contents
      # access to its own repository. Fork pull requests cannot read these secrets.
      - name: Check audio SDK access
        shell: pwsh
        env:
          AUDIO_SDK_TOKEN: ${{ secrets.AUDIO_SDK_TOKEN }}
          AUDIO_SDK_REPOSITORY: ${{ vars.AUDIO_SDK_REPOSITORY }}
          ASTERWAVE_TOKEN: ${{ secrets.ASTERWAVE_TOKEN }}
        run: |
          if (-not $env:AUDIO_SDK_TOKEN -or -not $env:AUDIO_SDK_REPOSITORY -or -not $env:ASTERWAVE_TOKEN) {
            Write-Output "::error::Private audio dependencies are unavailable. Set AUDIO_SDK_REPOSITORY, AUDIO_SDK_TOKEN (FMOD), and ASTERWAVE_TOKEN (read-only starbounded-dev/asterwave access). Fork pull requests cannot read secrets."
            exit 1
          }

      - name: Checkout FMOD SDKs (private)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ vars.AUDIO_SDK_REPOSITORY }}
          token: ${{ secrets.AUDIO_SDK_TOKEN }}
          path: .audio-sdk
          persist-credentials: false

      - name: Point the build at the audio SDKs
        shell: pwsh
        run: |
          "LUX_FMOD_SDK=$(Join-Path $env:GITHUB_WORKSPACE '.audio-sdk/FMOD/windows')" >> $env:GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Read pinned Asterwave revision
        id: asterwave
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from FetchAsterwave import load_manifest
          pin = load_manifest()
          if pin["repository"] != "starbounded-dev/asterwave":
              raise SystemExit("Unexpected Asterwave repository in manifest")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={pin['revision']}\n")
          PY

      - name: Checkout pinned Asterwave source (private)
        uses: actions/checkout@v6.0.2
        with:
          repository: starbounded-dev/asterwave
          ref: ${{ steps.asterwave.outputs.revision }}
          token: ${{ secrets.ASTERWAVE_TOKEN }}
          path: Core/vendor/Asterwave
          persist-credentials: false

      - name: Validate Asterwave source
        run: python scripts/FetchAsterwave.py --check

      - name: Test native Asterwave integration
        shell: bash
        run: |
          config="${{ matrix.configuration }}"
          [ "$config" != "Dist" ] || config=Release
          cmake -S tests/audio/asterwave -B bin/asterwave-tests -DCMAKE_BUILD_TYPE="$config"
          cmake --build bin/asterwave-tests --config "$config" --target lux_asterwave_tests
          ctest --test-dir bin/asterwave-tests -C "$config" --output-on-failure

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma, com.lunarg.vulkan.debug, com.lunarg.vulkan.glm
          install_runtime: true
          cache: true
          stripdown: true

          install_swiftshader: false
          install_lavapipe: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: 'x64'

      # Coral hardcodes hostfxr major version 9, and ScriptCore/Coral.Managed target net9.0,
      # so the .NET 9 SDK is required for the dotnet builds run by Setup.py.
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cd scripts
          python Setup.py ${{ env.PREMAKE_GENERATOR }}

      - name: Prepare logs
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: New-Item -ItemType Directory -Force logs

      - name: Test dependency layouts
        if: matrix.configuration == 'Debug'
        run: python tests/audio/run_sdk_layout.py

      # /restore runs the Restore target before the build. ScriptCore and Coral.Managed are
      # SDK-style C# projects inside Lux.sln, and those cannot build without the
      # obj/project.assets.json that a NuGet restore produces (error NETSDK1004). The same
      # properties are passed as for the build, so the solution's per-project platform mapping
      # resolves identically for both.
      - name: Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          MSBuild "${{ env.SOLUTION_FILE_PATH }}" /restore /m "/p:Configuration=${{ matrix.configuration }}" "/p:Platform=${{ env.BUILD_PLATFORM }}" /fl "/flp:logfile=logs\Build-${{ matrix.configuration }}.log;verbosity=normal"

      - name: Verify build output
        shell: pwsh
        run: |
          $output = "bin/${{ matrix.configuration }}-windows-x86_64"
          foreach ($file in @("Editor/Editor.exe", "Lux-Runtime/Lux-Runtime.exe", "Asterwave/Asterwave.lib")) {
            if (-not (Test-Path -LiteralPath (Join-Path $output $file) -PathType Leaf)) {
              throw "Missing build output: $output/$file"
            }
          }

      # Asterwave is statically linked into both executables. Public artifacts cannot be
      # made redistributable by stripping separate libraries, so publish build logs only.
      - name: Upload build logs
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.configuration }}
          path: logs/*.log
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          lfs: true

      # See the Windows job: licensed audio SDKs come from a private repository.
      - name: Check audio SDK access
        shell: bash
        env:
          AUDIO_SDK_TOKEN: ${{ secrets.AUDIO_SDK_TOKEN }}
          AUDIO_SDK_REPOSITORY: ${{ vars.AUDIO_SDK_REPOSITORY }}
          ASTERWAVE_TOKEN: ${{ secrets.ASTERWAVE_TOKEN }}
        run: |
          if [ -z "$AUDIO_SDK_TOKEN" ] || [ -z "$AUDIO_SDK_REPOSITORY" ] || [ -z "$ASTERWAVE_TOKEN" ]; then
            echo "::error::Private audio dependencies are unavailable. Set AUDIO_SDK_REPOSITORY, AUDIO_SDK_TOKEN (FMOD), and ASTERWAVE_TOKEN (read-only starbounded-dev/asterwave access). Fork pull requests cannot read secrets."
            exit 1
          fi

      - name: Checkout FMOD SDKs (private)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ vars.AUDIO_SDK_REPOSITORY }}
          token: ${{ secrets.AUDIO_SDK_TOKEN }}
          path: .audio-sdk
          persist-credentials: false

      - name: Point the build at the audio SDKs
        shell: bash
        run: |
          echo "LUX_FMOD_SDK=${GITHUB_WORKSPACE}/.audio-sdk/FMOD/linux" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Read pinned Asterwave revision
        id: asterwave
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from FetchAsterwave import load_manifest
          pin = load_manifest()
          if pin["repository"] != "starbounded-dev/asterwave":
              raise SystemExit("Unexpected Asterwave repository in manifest")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={pin['revision']}\n")
          PY

      - name: Checkout pinned Asterwave source (private)
        uses: actions/checkout@v6.0.2
        with:
          repository: starbounded-dev/asterwave
          ref: ${{ steps.asterwave.outputs.revision }}
          token: ${{ secrets.ASTERWAVE_TOKEN }}
          path: Core/vendor/Asterwave
          persist-credentials: false

      - name: Validate Asterwave source
        run: python scripts/FetchAsterwave.py --check

      # Coral hardcodes hostfxr major version 9, and ScriptCore targets net9.0.
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # GLFW is built with both the X11 and Wayland backends and runs wayland-scanner during
      # the build (wayland-scanner lives in libwayland-bin). NFD-Extended needs GTK3 for file
      # dialogs, and backward-cpp resolves symbols through libdw/libunwind.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm make pkg-config \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols \
            libdw-dev libunwind-dev libtbb-dev zlib1g-dev

          # The Dist configuration compiles with -flto, and premake's clang toolset then archives
          # with llvm-ar because GNU ar cannot index LLVM bitcode. Ubuntu ships that binary
          # version-suffixed, so make sure an unversioned llvm-ar resolves on PATH.
          if ! command -v llvm-ar >/dev/null 2>&1; then
            sudo ln -sf "$(ls -1 /usr/bin/llvm-ar-* | sort -V | tail -1)" /usr/bin/llvm-ar
          fi
          llvm-ar --version | head -1

      # Sets VULKAN_SDK, which Dependencies.lua and Linux-Build.sh both honour in preference
      # to the (gitignored) vendored SDK path.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma, com.lunarg.vulkan.debug, com.lunarg.vulkan.glm
          install_runtime: true
          cache: true
          stripdown: true

      - name: Test native Asterwave integration
        shell: bash
        run: |
          config="${{ matrix.configuration }}"
          [ "$config" != "Dist" ] || config=Release
          cmake -S tests/audio/asterwave -B bin/asterwave-tests -DCMAKE_BUILD_TYPE="$config"
          cmake --build bin/asterwave-tests --config "$config" --target lux_asterwave_tests
          ctest --test-dir bin/asterwave-tests -C "$config" --output-on-failure

      # Single entry point: generates the C# projects, builds the managed assemblies, the
      # native engine, and the sample game's scripts.
      - name: Build
        shell: bash
        run: |
          # pipefail so a build failure is not masked by tee's exit status.
          set -o pipefail
          mkdir -p logs
          ./scripts/Linux-Build.sh ${{ matrix.configuration }} 2>&1 \
            | tee "logs/Build-${{ matrix.configuration }}.log"

      # The build script is `set -e`, but assert the artifacts exist so a step that silently
      # produces nothing cannot pass.
      - name: Verify build output
        run: |
          out="bin/${{ matrix.configuration }}-linux-x86_64"
          fail=0
          for f in "$out/Editor/Editor" "$out/Lux-Runtime/Lux-Runtime"; do
            if [ -x "$f" ]; then
              echo "ok   $f"
            else
              echo "MISSING $f"; fail=1
            fi
          done
          exit $fail

      - name: Test dependency layouts
        if: matrix.configuration == 'Debug'
        run: python tests/audio/run_sdk_layout.py

      # Executables, static libraries, PDBs and source remain on the ephemeral runner.
      # This public workflow publishes logs only.
      - name: Upload build logs
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-${{ matrix.configuration }}
          path: logs/*.log
          if-no-files-found: ignore
