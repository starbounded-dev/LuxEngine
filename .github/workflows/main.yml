name: Build LuxEngine

on:
  workflow_dispatch:
    inputs:
      cold_build:
        description: Discard trusted self-hosted build objects before compiling
        type: boolean
        required: false
        default: false
      linux_vulkan_probe:
        description: Probe Linux CI Vulkan capabilities without compiling or accessing audio SDKs
        type: boolean
        required: false
        default: false
      linux_audio_check:
        description: Run one Linux audio gate instead of the full native matrix
        type: choice
        required: false
        default: 'off'
        options: ['off', runtime, debug-as]
      soundwave_cases:
        description: Space-separated native scene cases for the Linux runtime gate
        type: string
        required: false
        default: corner
  push:
    branches:
      - master
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - master
      - dev

env:
  GITHUB_WORKSPACE: ${{ github.workspace }}
  SOLUTION_FILE_PATH: Lux.sln
  BUILD_PLATFORM: Mixed Platforms
  PREMAKE_GENERATOR: vs2022

permissions:
  contents: read

jobs:
  linux-vulkan-probe:
    name: 'Diagnose: Linux Vulkan probe'
    if: github.event_name == 'workflow_dispatch' && inputs.linux_vulkan_probe
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars.LUX_SELF_HOSTED_LINUX == 'true' && '["self-hosted", "Linux", "X64", "luxengine", "linux-build"]' || '["ubuntu-26.04"]') }}
    steps:
      - name: Checkout the native launch helper
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: tests/audio/run_scene_acoustics.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Vulkan probe tools
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb xauth python3-yaml

      - name: Select the software Vulkan driver
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          drivers = list(Path('/usr/share/vulkan/icd.d').glob('*lvp*.json'))
          if len(drivers) != 1:
              raise RuntimeError(f'Expected one lavapipe driver manifest, found {drivers}')
          runtime_directory = Path(os.environ['RUNNER_TEMP']) / 'soundwave-vulkan-xdg'
          runtime_directory.mkdir(mode=0o700, exist_ok=True)
          runtime_directory.chmod(0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VK_DRIVER_FILES={drivers[0]}\n')
              env.write(f'XDG_RUNTIME_DIR={runtime_directory}\n')
          PY

      - name: Use provisioned Vulkan SDK
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$VULKAN_SDK/bin/glslc"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=$VULKAN_SDK/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - name: Install the validation SDK for the isolated launch probe
        if: runner.environment != 'self-hosted'
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma, com.lunarg.vulkan.debug, com.lunarg.vulkan.glm
          install_runtime: true
          cache: true
          stripdown: true

      - name: Probe isolated Debug validation loading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import os
          import shutil
          import subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('scene_acoustics', 'tests/audio/run_scene_acoustics.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          package_lib = Path('logs/package-lib').resolve()
          package_lib.mkdir(parents=True)
          loader = Path(os.environ['VULKAN_SDK']) / 'lib/libvulkan.so.1'
          shutil.copy2(loader, package_lib / loader.name)
          environment = dict(os.environ, LD_LIBRARY_PATH=str(package_lib))
          manifest = helper.prepare_linux_validation(environment, Path('logs/runtime-validation'))
          result = subprocess.run(['xvfb-run', '-a', '-s', '-screen 0 1280x720x24', 'vulkaninfo', '--summary'],
                                  env=environment, text=True, capture_output=True, timeout=120)
          cube = subprocess.run(['xvfb-run', '-a', '-s', '-screen 0 1280x720x24', 'vkcube', '--validate', '--c', '2'],
                                env=environment, text=True, capture_output=True, timeout=120)
          report = result.stdout + result.stderr + cube.stdout + cube.stderr
          Path('logs/vulkan-runtime-validation.txt').write_text(report)
          print(report)
          if result.returncode or cube.returncode or 'VK_LAYER_KHRONOS_validation' not in report:
              raise RuntimeError(f'Isolated validation-layer probe failed: info={result.returncode}, cube={cube.returncode}; {manifest}')
          if any(marker in report for marker in ('VUID-', 'Validation Error', 'Validation Warning', 'UNASSIGNED-', 'SYNC-', 'BestPractices-')):
              raise RuntimeError('Validation messages in isolated layer probe')
          print('PASS: Vulkan validation loads with package-only LD_LIBRARY_PATH')
          PY

      - name: Probe presentation and required core features
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x720x24' vulkaninfo --summary | tee logs/vulkan-summary.txt
          xvfb-run -a -s '-screen 0 1280x720x24' vulkaninfo > logs/vulkan-capabilities.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          report = Path('logs/vulkan-capabilities.txt').read_text()
          # These are unconditionally requested by the engine's VulkanDevice.
          required = ('shaderImageGatherExtended', 'samplerAnisotropy', 'textureCompressionBC', 'tessellationShader',
                      'geometryShader', 'imageCubeArray', 'dualSrcBlend', 'independentBlend',
                      'fillModeNonSolid', 'wideLines', 'pipelineStatisticsQuery',
                      'descriptorIndexing', 'runtimeDescriptorArray', 'descriptorBindingPartiallyBound',
                      'descriptorBindingVariableDescriptorCount', 'timelineSemaphore',
                      'shaderSampledImageArrayNonUniformIndexing')
          missing = [name for name in required if not re.search(r'^\s*' + name + r'\s*=\s*true\s*$', report, re.M)]
          result = 'Required core feature probe: ' + ('PASS' if not missing else 'FAIL: ' + ', '.join(missing))
          Path('logs/vulkan-engine-features.txt').write_text(result + '\n')
          print(result)
          if missing:
              raise SystemExit(1)
          PY

      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-linux-vulkan-probe
          path: |
            logs/vulkan-*.txt
            logs/runtime-validation/*.json
          if-no-files-found: warn

  # The build's version string, 2026.N-<7-char commit>: the series from Version.h
  # (LUX_VERSION_SERIES), so the binaries, the zips and the release tag (v<version>) agree.
  version:
    name: 'Prepare: version'
    if: ${{ !inputs.linux_vulkan_probe }}
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.version.outputs.series }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Version.h
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: Core/Source/Lux/Core/Version.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compute the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          series="$(sed -n 's/^#define LUX_VERSION_SERIES "\([^"]*\)".*/\1/p' Core/Source/Lux/Core/Version.h)"
          # Checked before it reaches a file name, a tag or a header.
          if ! [[ "$series" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
            echo "::error::LUX_VERSION_SERIES in Version.h is not YYYY.N: '$series'"
            exit 1
          fi
          version="${series}-${GITHUB_SHA::7}"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  test:
    name: 'Test: Windows (${{ matrix.configuration }})'
    if: ${{ !inputs.linux_vulkan_probe && (!inputs.linux_audio_check || inputs.linux_audio_check == 'off') }}
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && '["self-hosted", "Windows", "X64", "luxengine", "windows-build"]' || '["windows-2025"]') }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          clean: ${{ runner.environment != 'self-hosted' }}

      # The vendored miniaudio checks for the native backend; they need no audio SDK, device or
      # engine build, so they run beside the builds and a failure here never hides a build result.
      - name: 'Test: native audio'
        shell: bash
        run: |
          cmake -S tests/audio/native -B bin/native-audio-tests/${{ matrix.configuration }} -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          cmake --build bin/native-audio-tests/${{ matrix.configuration }} --config ${{ matrix.configuration }}
          ctest --test-dir bin/native-audio-tests/${{ matrix.configuration }} -C ${{ matrix.configuration }} --output-on-failure

  build:
    name: 'Build: Windows (${{ matrix.configuration }})'
    needs: version
    if: ${{ !inputs.linux_audio_check || inputs.linux_audio_check == 'off' }}
    # Pull requests stay on disposable hosted runners, including same-repository PRs.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && '["self-hosted", "Windows", "X64", "luxengine", "windows-build"]' || '["windows-2025"]') }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          lfs: true
          clean: ${{ runner.environment != 'self-hosted' }}

      - name: Prepare persistent build cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: python scripts/ci/PersistentBuild.py prepare --platform windows --configuration '${{ matrix.configuration }}' ${{ inputs.cold_build && '--cold' || '' }}

      # Version.h includes this when present: LUX_VERSION becomes 2026.N-<commit>, printed by
      # --version and in the startup log.
      - name: Bake the version string
        shell: pwsh
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $path = 'Core/Source/Lux/Core/BuildVersion.h'
          $content = "#pragma once`n#define LUX_VERSION `"$env:LUX_BUILD_VERSION`"`n"
          if (!(Test-Path $path) -or [IO.File]::ReadAllText((Join-Path $PWD $path)) -ne $content) {
            [IO.File]::WriteAllText((Join-Path $PWD $path), $content, [Text.UTF8Encoding]::new($false))
          }

      - name: Setup Python
        if: runner.environment != 'self-hosted'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Verify provisioned build tools
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (!(Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) {
            throw "Provisioned Vulkan SDK is missing: $env:VULKAN_SDK"
          }
          python --version
          dotnet --version
          cmake --version
          git lfs version

      - name: Install Vulkan SDK
        if: runner.environment != 'self-hosted'
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma, com.lunarg.vulkan.debug, com.lunarg.vulkan.glm
          install_runtime: true
          cache: true
          stripdown: true

          install_swiftshader: false
          install_lavapipe: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: 'x64'

      # Coral hardcodes hostfxr major version 9, and ScriptCore/Coral.Managed target net9.0,
      # so the .NET 9 SDK is required for the dotnet builds run by Setup.py.
      - name: Set up .NET 9
        if: runner.environment != 'self-hosted'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cd scripts
          python Setup.py ${{ env.PREMAKE_GENERATOR }}

      - name: Prepare logs
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: New-Item -ItemType Directory -Force logs

      # C# first, with the .NET SDK's own build (dotnet has its SDK resolver built in), then the C++
      # projects with Visual Studio's MSBuild. Building Lux.sln with MSBuild needs the Build Tools'
      # .NET SDK resolver to load ScriptCore and Coral.Managed, and the self-hosted runner's Build
      # Tools don't have it (MSB4236). No C++ project references a C# one: Core's dependson
      # "Coral.Managed" is solution-level only, and Core's post-build copies Coral.Managed from
      # Coral/Build/Release, which is why that project always builds in Release. The C++ entry
      # projects pull in Core and every vendor library through their ProjectReferences. Dist builds
      # no Editor, as in the solution.
      - name: Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = '${{ matrix.configuration }}'
          dotnet build Core/vendor/Coral/Coral.Managed/Coral.Managed.csproj -c Release -nologo "-flp:logfile=logs\Build-$config-Coral.Managed.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ScriptCore/ScriptCore.csproj -c $config -nologo "-flp:logfile=logs\Build-$config-ScriptCore.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $projects = @('Lux-Runtime/Lux-Runtime.vcxproj', 'Watchdog/Lux-Watchdog.vcxproj')
          if ($config -ne 'Dist') { $projects = @('Editor/Editor.vcxproj') + $projects }
          foreach ($project in $projects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            MSBuild $project /m "/p:Configuration=$config" /p:Platform=x64 "/p:SolutionDir=$PWD\" /fl "/flp:logfile=logs\Build-$config-$name.log;verbosity=normal"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The manual's C# API reference (Editor/Resources/Docs/api) is generated from the built
      # ScriptCore.dll and its XML docs. Fails when a page is stale (regenerate it with the same
      # command without --check) or a public member has no <summary>.
      - name: Check the C# API reference
        if: matrix.configuration == 'Release'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: dotnet run --project tools/ScriptApiDocs -c Release -- Editor/Resources/Scripts/ScriptCore.dll Editor/Resources/Docs --check

      - name: 'Package: editor artifact'
        if: matrix.configuration == 'Release'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          $configuration = "${{ matrix.configuration }}"
          $editorOutput = Join-Path "bin" "$configuration-windows-x86_64\Editor"
          $artifactRoot = Join-Path "artifacts" "Editor-$configuration"
          $editorItems = @(
            "LuxSampleProject",
            "Resources",
            "DotNet"
          )

          # Editor state, not build input: both are regenerated on first run (ApplicationSettings
          # falls back to defaults when App.lsettings is absent) and are gitignored, so they do
          # not exist in a clean checkout. Copy them when present, never fail on them.
          $optionalEditorItems = @(
            "imgui.ini",
            "App.lsettings"
          )

          if (!(Test-Path $editorOutput)) {
            throw "Editor build output was not found: $editorOutput"
          }

          Remove-Item $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $artifactRoot | Out-Null

          Copy-Item -Path (Join-Path $editorOutput "*") -Destination $artifactRoot -Recurse -Force

          foreach ($item in $editorItems) {
            $source = Join-Path "Editor" $item
            if (!(Test-Path $source)) {
              throw "Editor artifact input was not found: $source"
            }

            Copy-Item -Path $source -Destination $artifactRoot -Recurse -Force
          }

          foreach ($item in $optionalEditorItems) {
            $source = Join-Path "Editor" $item
            if (Test-Path $source) {
              Copy-Item -Path $source -Destination $artifactRoot -Recurse -Force
            } else {
              Write-Host "Skipping optional editor state file (not present): $source"
            }
          }

          # The engine deploys no audio libraries; an FMOD library left by an old build must never ship.
          $fmod = Get-ChildItem -Path $artifactRoot -Recurse -File -Include "fmod*.dll"
          if ($fmod) {
            throw "FMOD libraries in the artifact: $($fmod.FullName -join ', ')"
          }

      - name: 'Package: upload editor artifact'
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.configuration }}
          path: artifacts/Editor-${{ matrix.configuration }}/
          if-no-files-found: error

      # The pre-release download: the same package (editor, Resources, DotNet, sample project) in one
      # top-level folder.
      - name: 'Package: zip release'
        if: matrix.configuration == 'Release'
        shell: pwsh
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $reported = & "bin\${{ matrix.configuration }}-windows-x86_64\Editor\Editor.exe" --version
          Write-Host "Editor --version: $reported"
          if ($LASTEXITCODE -ne 0 -or "$reported" -notlike "*$env:LUX_BUILD_VERSION*") {
            # 0xC0000135 = a DLL is missing; name it. Delay-loaded vulkan-1 is expected to be absent here.
            $dir = "bin\${{ matrix.configuration }}-windows-x86_64\Editor"
            $dumpbin = Get-ChildItem "C:\BuildTools\VC\Tools\MSVC\*\bin\HostX64\x64\dumpbin.exe" | Select-Object -First 1
            foreach ($pe in Get-ChildItem "$dir\*" -Include *.exe,*.dll -File) {
              $deps = & $dumpbin.FullName /dependents $pe.FullName | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
              foreach ($d in $deps) {
                if ($d -like 'api-ms-*' -or $d -like 'ext-ms-*' -or $d -eq 'vulkan-1.dll') { continue }
                $found = (Test-Path (Join-Path $dir $d)) -or (Test-Path (Join-Path $env:SystemRoot "System32\$d")) -or (Get-Command $d -ErrorAction SilentlyContinue)
                if (-not $found) { Write-Host "MISSING: $d (needed by $($pe.Name))" }
              }
            }
            throw "Editor.exe --version did not report $env:LUX_BUILD_VERSION (exit $LASTEXITCODE)"
          }

          $editor = Join-Path "artifacts" "Editor-${{ matrix.configuration }}"
          $name = "LuxEngine-$env:LUX_BUILD_VERSION-windows-x64"
          Rename-Item $editor $name
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip -mx=7 "release/$name.zip" "./artifacts/$name"
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }

      - name: 'Package: upload release'
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Report persistent build cache
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: python scripts/ci/PersistentBuild.py report --platform windows --configuration '${{ matrix.configuration }}'

      - name: Upload build logs
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.configuration }}
          path: logs/*.log
          if-no-files-found: ignore

  test-linux:
    name: 'Test: Linux (${{ matrix.configuration }})'
    if: ${{ !inputs.linux_vulkan_probe }}
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars.LUX_SELF_HOSTED_LINUX == 'true' && '["self-hosted", "Linux", "X64", "luxengine", "linux-build"]' || '["ubuntu-26.04"]') }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          clean: ${{ runner.environment != 'self-hosted' }}

      # The vendored miniaudio checks for the native backend; they need no audio SDK, device or
      # engine build, so they run beside the builds and a failure here never hides a build result.
      - name: 'Test: native audio'
        shell: bash
        run: |
          cmake -S tests/audio/native -B bin/native-audio-tests/${{ matrix.configuration }} -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          cmake --build bin/native-audio-tests/${{ matrix.configuration }} --config ${{ matrix.configuration }}
          ctest --test-dir bin/native-audio-tests/${{ matrix.configuration }} -C ${{ matrix.configuration }} --output-on-failure

  build-linux:
    name: 'Build: Linux (${{ matrix.configuration }})'
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars.LUX_SELF_HOSTED_LINUX == 'true' && '["self-hosted", "Linux", "X64", "luxengine", "linux-build"]' || '["ubuntu-26.04"]') }}
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.linux_audio_check == 'debug-as' && '["Debug-AS"]' || inputs.linux_audio_check == 'runtime' && '["Debug"]' || '["Debug", "Debug-AS", "Release", "Dist"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          lfs: true
          clean: ${{ runner.environment != 'self-hosted' }}

      - name: Prepare persistent build cache
        if: runner.environment == 'self-hosted'
        shell: bash
        run: python scripts/ci/PersistentBuild.py prepare --platform linux --configuration '${{ matrix.configuration }}' ${{ inputs.cold_build && '--cold' || '' }}

      # See the Windows job.
      - name: Bake the version string
        shell: bash
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('Core/Source/Lux/Core/BuildVersion.h')
          content = '#pragma once\n#define LUX_VERSION "' + os.environ['LUX_BUILD_VERSION'] + '"\n'
          if not path.exists() or path.read_text() != content:
              path.write_text(content)
          PY

      # Coral hardcodes hostfxr major version 9, and ScriptCore targets net9.0.
      - name: Set up .NET 9
        if: runner.environment != 'self-hosted'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # GLFW is built with both the X11 and Wayland backends and runs wayland-scanner during
      # the build (wayland-scanner lives in libwayland-bin). NFD-Extended needs GTK3 for file
      # dialogs, and backward-cpp resolves symbols through libdw/libunwind.
      - name: Install build dependencies
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libclang-rt-dev make pkg-config ccache \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols \
            libdw-dev libunwind-dev libtbb-dev zlib1g-dev zip

          # The Dist configuration compiles with -flto, and premake's clang toolset then archives
          # with llvm-ar because GNU ar cannot index LLVM bitcode. Ubuntu ships that binary
          # version-suffixed, so make sure an unversioned llvm-ar resolves on PATH.
          if ! command -v llvm-ar >/dev/null 2>&1; then
            sudo ln -sf "$(ls -1 /usr/bin/llvm-ar-* | sort -V | tail -1)" /usr/bin/llvm-ar
          fi
          llvm-ar --version | head -1

      - name: Restore hosted compiler cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/luxengine/ccache
          key: linux-ccache-v1-${{ runner.arch }}-${{ matrix.configuration }}-${{ hashFiles('**/premake5.lua', 'Dependencies.lua') }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-v1-${{ runner.arch }}-${{ matrix.configuration }}-${{ hashFiles('**/premake5.lua', 'Dependencies.lua') }}-

      - name: Enable available compiler cache
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            wrapper="$RUNNER_TEMP/lux-ccache-bin"
            mkdir -p "$wrapper" "$HOME/.cache/luxengine/ccache"
            for compiler in clang clang++ gcc g++ cc c++; do
              ln -sf "$(command -v ccache)" "$wrapper/$compiler"
            done
            echo "$wrapper" >> "$GITHUB_PATH"
            echo "CCACHE_DIR=$HOME/.cache/luxengine/ccache" >> "$GITHUB_ENV"
            echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
            CCACHE_DIR="$HOME/.cache/luxengine/ccache" ccache --max-size=1G
          else
            echo 'ccache is not provisioned; persistent objects still work on self-hosted runners.'
          fi

      - name: Install native runtime test services
        if: inputs.linux_audio_check == 'runtime' && runner.environment != 'self-hosted'
        run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb xauth python3-yaml pulseaudio pulseaudio-utils

      - name: Select the native runtime software driver
        if: inputs.linux_audio_check == 'runtime'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          drivers = list(Path('/usr/share/vulkan/icd.d').glob('*lvp*.json'))
          if len(drivers) != 1:
              raise RuntimeError(f'Expected one lavapipe driver manifest, found {drivers}')
          runtime_directory = Path(os.environ['RUNNER_TEMP']) / 'soundwave-runtime-xdg'
          runtime_directory.mkdir(mode=0o700, exist_ok=True)
          runtime_directory.chmod(0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VK_DRIVER_FILES={drivers[0]}\n')
              env.write(f'XDG_RUNTIME_DIR={os.environ["RUNNER_TEMP"]}/soundwave-runtime-xdg\n')
          PY

      # Sets VULKAN_SDK, which Dependencies.lua and Linux-Build.sh both honour in preference
      # to the (gitignored) vendored SDK path.
      - name: Use provisioned Vulkan SDK
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$VULKAN_SDK/bin/glslc"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=$VULKAN_SDK/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK
        if: runner.environment != 'self-hosted'
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma, com.lunarg.vulkan.debug, com.lunarg.vulkan.glm
          install_runtime: true
          cache: true
          stripdown: true

      # Single entry point: generates the C# projects, builds the managed assemblies, the
      # native engine, and the sample game's scripts.
      - name: Build
        shell: bash
        env:
          LUX_RUN_AUDIO_TESTS: ${{ (matrix.configuration == 'Debug' || matrix.configuration == 'Debug-AS') && '1' || '0' }}
        run: |
          # pipefail so a build failure is not masked by tee's exit status.
          set -o pipefail
          mkdir -p logs
          touch logs/linux-build-start
          ./scripts/Linux-Build.sh ${{ matrix.configuration }} 2>&1 \
            | tee "logs/Build-${{ matrix.configuration }}.log"

      - name: Upload audio verification logs
        if: always() && (matrix.configuration == 'Debug' || matrix.configuration == 'Debug-AS')
        uses: actions/upload-artifact@v4
        with:
          name: audio-verification-linux-${{ matrix.configuration }}
          path: |
            bin/audio-tests/**/*.log
            logs/Build-${{ matrix.configuration }}.log
          if-no-files-found: ignore

      # The build script is `set -e`, but assert the artifacts exist so a step that silently
      # produces nothing cannot pass.
      - name: Verify build output
        if: ${{ !cancelled() }}
        run: |
          out="bin/${{ matrix.configuration }}-linux-x86_64"
          fail=0
          for f in "$out/Core/libCore.a" "$out/Editor/Editor" "$out/Lux-Runtime/Lux-Runtime"; do
            if [ -s "$f" ] && [ "$f" -nt logs/linux-build-start ]; then
              echo "ok   $f"
            else
              echo "MISSING, EMPTY OR STALE $f"; fail=1
            fi
          done
          if [ "${{ matrix.configuration }}" = "Debug-AS" ] && [ "$fail" = "0" ]; then
            nm --undefined-only "$out/Core/libCore.a" > logs/core-asan-symbols.txt
            nm "$out/Lux-Runtime/Lux-Runtime" > logs/runtime-asan-symbols.txt
            grep -E '__asan_(report_|load|store)' logs/core-asan-symbols.txt > /dev/null
            grep '__asan_init$' logs/runtime-asan-symbols.txt > /dev/null
            echo "Verified AddressSanitizer instrumentation in Core and Lux-Runtime"
          fi
          exit $fail

      - name: Verify native Play export and packaged player
        if: inputs.linux_audio_check == 'runtime'
        shell: bash
        env:
          LUX_SOUNDWAVE_CASES: ${{ inputs.soundwave_cases }}
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR" logs
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --log-target=file:logs/pulseaudio.log
          pactl load-module module-null-sink sink_name=soundwave-test
          read -r -a scene_cases <<< "$LUX_SOUNDWAVE_CASES"
          if [ "${#scene_cases[@]}" = "0" ]; then
            echo "::error::At least one Soundwave scene case is required."
            exit 1
          fi
          xvfb-run -a -s '-screen 0 1280x720x24' python3 -u tests/audio/run_scene_acoustics.py \
            --config debug --threading single --export-runtime --cases "${scene_cases[@]}" --timeout 900 \
            2>&1 | tee logs/soundwave-native-runtime.log

      - name: Upload native runtime evidence
        if: always() && inputs.linux_audio_check == 'runtime'
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-native-linux-runtime
          path: |
            logs/soundwave-native-runtime.log
            logs/pulseaudio.log
            bin/golden/**/*.log
            bin/golden/**/*.yaml
            bin/golden/**/*.status
            bin/golden/**/summary.json
            bin/golden/**/vulkan-validation/*.json
            bin/soundwave-scene-tests/**/results.json
          if-no-files-found: warn

      - name: Upload native sanitizer symbol evidence
        if: always() && matrix.configuration == 'Debug-AS'
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-native-linux-asan-symbols
          path: logs/*-asan-symbols.txt
          if-no-files-found: warn

      # Unlike Windows, the Linux build output holds only the executable, and the binary is
      # linked with RPATH $ORIGIN/lib - so the vendored shared libraries have to be bundled
      # into lib/ for the artifact to be runnable at all.
      - name: 'Package: editor artifact'
        if: matrix.configuration == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          out="bin/${{ matrix.configuration }}-linux-x86_64/Editor"
          root="artifacts/Editor-linux-${{ matrix.configuration }}"

          rm -rf "$root"
          mkdir -p "$root/lib"
          cp -a "$out/." "$root/"

          for item in LuxSampleProject Resources DotNet; do
            if [ ! -e "Editor/$item" ]; then
              echo "Editor artifact input was not found: Editor/$item" >&2
              exit 1
            fi
            cp -a "Editor/$item" "$root/"
          done

          # Drop build intermediates and asset caches that the build regenerates. Scripts/Binaries
          # is deliberately kept - it holds the sample game's compiled script assembly.
          find "$root/LuxSampleProject" -type d \
            \( -name Intermediates -o -name obj -o -name Cache \) -prune -exec rm -rf {} + 2>/dev/null || true

          # Editor state, regenerated on first run and gitignored, so absent in a clean checkout.
          for item in imgui.ini App.lsettings; do
            [ -e "Editor/$item" ] && cp -a "Editor/$item" "$root/" \
              || echo "Skipping optional editor state file (not present): Editor/$item"
          done

          # Bundle only the libraries the binary actually resolves out of our vendored
          # directories. Globbing every *.so from the Vulkan SDK pulled in ~780 MB of
          # validation layers and SPIRV tooling that the editor never loads; ldd reports the
          # full transitive closure, so filtering it keeps exactly what is needed.
          vendor_dirs=""
          for dir in "Core/vendor/assimp/bin/linux" \
                     "Core/vendor/NvidiaAftermath/lib/x64/linux" \
                     "${VULKAN_SDK:-}/lib"; do
            if [ -d "$dir" ]; then
              vendor_dirs="$vendor_dirs $(cd "$dir" && pwd)"
            fi
          done

          # So ldd can resolve the vendored libraries, which are not on the default search path.
          export LD_LIBRARY_PATH="$(echo $vendor_dirs | tr ' ' ':')"

          for lib in $(ldd "$root/Editor" | awk '$3 ~ /^\// {print $3}' | sort -u); do
            for dir in $vendor_dirs; do
              case "$lib" in
                "$dir"/*) cp -aL "$lib" "$root/lib/"; break ;;
              esac
            done
          done

          # The engine deploys no audio libraries; an FMOD library left by an old build must never ship.
          if find "$root" -name 'libfmod*' | grep -q .; then
            echo "FMOD libraries in the artifact" >&2
            exit 1
          fi

          echo "Bundled $(find "$root/lib" -type f | wc -l) shared libraries ($(du -sh "$root/lib" | cut -f1))."

          # The binary's RPATH is $ORIGIN/lib, so the bundle must resolve with no
          # LD_LIBRARY_PATH set - otherwise we would ship an artifact that only runs on a
          # machine that already has these libraries.
          unresolved="$(env -u LD_LIBRARY_PATH ldd "$root/Editor" | grep 'not found' || true)"
          if [ -n "$unresolved" ]; then
            echo "Editor artifact has unresolved libraries:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

      - name: 'Package: upload editor artifact'
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: editor-linux-${{ matrix.configuration }}
          path: artifacts/Editor-linux-${{ matrix.configuration }}/
          if-no-files-found: error

      # See the Windows job. Zipped here, not in the release job: artifacts do not keep file
      # modes, and the zip must keep the executable bit and the lib/ symlinks.
      - name: 'Package: zip release'
        if: matrix.configuration == 'Release'
        shell: bash
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          editor="artifacts/Editor-linux-${{ matrix.configuration }}"

          reported="$(LD_LIBRARY_PATH="$editor/lib" "$editor/Editor" --version)"
          echo "Editor --version: $reported"
          if [[ "$reported" != *"$LUX_BUILD_VERSION"* ]]; then
            echo "::error::Editor --version did not report $LUX_BUILD_VERSION"
            exit 1
          fi

          name="LuxEngine-${LUX_BUILD_VERSION}-linux-x64"
          mv "$editor" "artifacts/$name"
          mkdir -p release
          (cd artifacts && zip -r -y -q "../release/$name.zip" "$name")

      - name: 'Package: upload release'
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Report compiler cache
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Save trusted hosted compiler cache
        if: always() && runner.environment != 'self-hosted' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/luxengine/ccache
          key: linux-ccache-v1-${{ runner.arch }}-${{ matrix.configuration }}-${{ hashFiles('**/premake5.lua', 'Dependencies.lua') }}-${{ github.sha }}

      - name: Report persistent build cache
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: python scripts/ci/PersistentBuild.py report --platform linux --configuration '${{ matrix.configuration }}'

      - name: Upload build logs
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-${{ matrix.configuration }}
          path: logs/*.log
          if-no-files-found: ignore

  # Every push to dev publishes one pre-release, v2026.N-<commit>, with both platforms' packages,
  # then deletes all but the 10 newest dev pre-releases of the series (and their tags). Never runs
  # for pull requests or other branches.
  release:
    name: 'Ship: dev pre-release'
    needs: [version, test, test-linux, build, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two quick pushes publish one after the other, so the cleanup never races a publish.
    concurrency:
      group: dev-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      SERIES: ${{ needs.version.outputs.series }}

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Publish the pre-release
        shell: bash
        run: |
          set -euo pipefail
          ls -l release
          if [ "$(find release -name '*.zip' | wc -l)" -ne 2 ]; then
            echo "::error::Expected the Windows and Linux packages in release/"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run for the same commit: replace its packages.
            gh release upload "$TAG" release/*.zip --clobber
          else
            # --notes is prepended to the generated notes.
            gh release create "$TAG" release/*.zip \
              --target "$GITHUB_SHA" \
              --prerelease \
              --generate-notes \
              --notes "Alpha: the API will change."
          fi

      - name: Delete old dev pre-releases
        shell: bash
        run: |
          set -euo pipefail
          keep=10
          # Only pre-releases tagged exactly v<series>-<7 hex>; nothing else is ever touched. A literal
          # prefix, not a regex, so the series' dot matches only a dot.
          prefix="v${SERIES}-"

          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.draft | not)) | [.created_at, .tag_name] | @tsv' \
            | awk -F '\t' -v prefix="$prefix" \
                'index($2, prefix) == 1 && substr($2, length(prefix) + 1) ~ /^[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]$/' \
            | sort -r \
            | tail -n +$((keep + 1)) \
            | cut -f2 \
            | while read -r tag; do
                echo "Deleting pre-release and tag $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
