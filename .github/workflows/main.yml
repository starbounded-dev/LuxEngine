name: Build LuxEngine

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
      - 'features/**' # Glob pattern for any branch starting with 'features/'
  pull_request:
    branches:
      - master
      - dev

env:
  GITHUB_WORKSPACE: ${{ github.workspace }}
  SOLUTION_FILE_PATH: Lux.sln
  BUILD_PLATFORM: Mixed Platforms
  PREMAKE_GENERATOR: vs2022

permissions:
  contents: read

jobs:
  # The build's version string, 2026.N-<7-char commit>: the series from Version.h
  # (LUX_VERSION_SERIES), so the binaries, the zips and the release tag (v<version>) agree.
  version:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.version.outputs.series }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Version.h
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: Core/Source/Lux/Core/Version.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compute the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          series="$(sed -n 's/^#define LUX_VERSION_SERIES "\([^"]*\)".*/\1/p' Core/Source/Lux/Core/Version.h)"
          # Checked before it reaches a file name, a tag or a header.
          if ! [[ "$series" =~ ^[0-9]{4}\.[0-9]+$ ]]; then
            echo "::error::LUX_VERSION_SERIES in Version.h is not YYYY.N: '$series'"
            exit 1
          fi
          version="${series}-${GITHUB_SHA::7}"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build:
    needs: version
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          lfs: true

      # FMOD and Vercidium Audio are licensed SDKs that must never be committed to this public
      # repository. They come from a private repository (repository variable
      # AUDIO_SDK_REPOSITORY, laid out by scripts/ci/StageAudioSDKs.py), read with a fine-grained
      # read-only token scoped to that one repository (secret AUDIO_SDK_TOKEN). Pull requests
      # from forks cannot read secrets, so their builds stop here with an explicit message.
      - name: Check audio SDK access
        shell: pwsh
        env:
          AUDIO_SDK_TOKEN: ${{ secrets.AUDIO_SDK_TOKEN }}
          AUDIO_SDK_REPOSITORY: ${{ vars.AUDIO_SDK_REPOSITORY }}
        run: |
          if (-not $env:AUDIO_SDK_TOKEN -or -not $env:AUDIO_SDK_REPOSITORY) {
            Write-Output "::error::FMOD/Vercidium Audio SDKs are unavailable. Set the repository variable AUDIO_SDK_REPOSITORY and the secret AUDIO_SDK_TOKEN (pull requests from forks cannot read secrets)."
            exit 1
          }

      - name: Checkout audio SDKs (private)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ vars.AUDIO_SDK_REPOSITORY }}
          token: ${{ secrets.AUDIO_SDK_TOKEN }}
          path: .audio-sdk
          persist-credentials: false

      - name: Point the build at the audio SDKs
        shell: pwsh
        run: |
          "LUX_FMOD_SDK=$(Join-Path $env:GITHUB_WORKSPACE '.audio-sdk/FMOD/windows')" >> $env:GITHUB_ENV
          "LUX_VA_SDK=$(Join-Path $env:GITHUB_WORKSPACE '.audio-sdk/VA_RAY')" >> $env:GITHUB_ENV

      # Version.h includes this when present: LUX_VERSION becomes 2026.N-<commit>, printed by
      # --version and in the startup log.
      - name: Bake the version string
        shell: pwsh
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          Set-Content -Path Core/Source/Lux/Core/BuildVersion.h -Encoding utf8 -Value @(
            "#pragma once",
            "#define LUX_VERSION `"$env:LUX_BUILD_VERSION`""
          )

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma, com.lunarg.vulkan.debug, com.lunarg.vulkan.glm
          install_runtime: true
          cache: true
          stripdown: true

          install_swiftshader: false
          install_lavapipe: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: 'x64'

      # Coral hardcodes hostfxr major version 9, and ScriptCore/Coral.Managed target net9.0,
      # so the .NET 9 SDK is required for the dotnet builds run by Setup.py.
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cd scripts
          python Setup.py ${{ env.PREMAKE_GENERATOR }}

      - name: Prepare logs
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: New-Item -ItemType Directory -Force logs

      # /restore runs the Restore target before the build. ScriptCore and Coral.Managed are
      # SDK-style C# projects inside Lux.sln, and those cannot build without the
      # obj/project.assets.json that a NuGet restore produces (error NETSDK1004). The same
      # properties are passed as for the build, so the solution's per-project platform mapping
      # resolves identically for both.
      - name: Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          MSBuild "${{ env.SOLUTION_FILE_PATH }}" /restore /m "/p:Configuration=${{ matrix.configuration }}" "/p:Platform=${{ env.BUILD_PLATFORM }}" /fl "/flp:logfile=logs\Build-${{ matrix.configuration }}.log;verbosity=normal"

      # The manual's C# API reference (Editor/Resources/Docs/api) is generated from the built
      # ScriptCore.dll and its XML docs. Fails when a page is stale (regenerate it with the same
      # command without --check) or a public member has no <summary>.
      - name: Check the C# API reference
        if: matrix.configuration == 'Release'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: dotnet run --project tools/ScriptApiDocs -c Release -- Editor/Resources/Scripts/ScriptCore.dll Editor/Resources/Docs --check

      - name: Package editor artifact
        if: matrix.configuration == 'Release'
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          $configuration = "${{ matrix.configuration }}"
          $editorOutput = Join-Path "bin" "$configuration-windows-x86_64\Editor"
          $artifactRoot = Join-Path "artifacts" "Editor-$configuration"
          $editorItems = @(
            "LuxSampleProject",
            "Resources",
            "DotNet"
          )

          # Editor state, not build input: both are regenerated on first run (ApplicationSettings
          # falls back to defaults when App.lsettings is absent) and are gitignored, so they do
          # not exist in a clean checkout. Copy them when present, never fail on them.
          $optionalEditorItems = @(
            "imgui.ini",
            "App.lsettings"
          )

          if (!(Test-Path $editorOutput)) {
            throw "Editor build output was not found: $editorOutput"
          }

          Remove-Item $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $artifactRoot | Out-Null

          Copy-Item -Path (Join-Path $editorOutput "*") -Destination $artifactRoot -Recurse -Force

          foreach ($item in $editorItems) {
            $source = Join-Path "Editor" $item
            if (!(Test-Path $source)) {
              throw "Editor artifact input was not found: $source"
            }

            Copy-Item -Path $source -Destination $artifactRoot -Recurse -Force
          }

          foreach ($item in $optionalEditorItems) {
            $source = Join-Path "Editor" $item
            if (Test-Path $source) {
              Copy-Item -Path $source -Destination $artifactRoot -Recurse -Force
            } else {
              Write-Host "Skipping optional editor state file (not present): $source"
            }
          }

          # FMOD and Vercidium Audio runtime libraries must not be redistributed: artifacts on a
          # public repository are downloadable by anyone, and both EULAs forbid shipping their
          # libraries outside a game build (FMOD also forbids shipping them as part of an engine).
          # Users copy the DLLs from their own SDK downloads next to Editor.exe.
          $audioLibraryPatterns = @("fmod*.dll", "vaudionative*.dll")
          Get-ChildItem -Path $artifactRoot -Recurse -File -Include $audioLibraryPatterns |
            ForEach-Object { Write-Host "Stripping licensed audio library: $($_.FullName)"; Remove-Item $_.FullName -Force }

          $remaining = Get-ChildItem -Path $artifactRoot -Recurse -File -Include $audioLibraryPatterns
          if ($remaining) {
            throw "Licensed audio libraries remain in the artifact: $($remaining.FullName -join ', ')"
          }

          Set-Content -Path (Join-Path $artifactRoot "AUDIO_LIBRARIES_REQUIRED.txt") -Encoding utf8 -Value @(
            "This build does not include the FMOD or Vercidium Audio runtime libraries (licence restrictions).",
            "Download the SDKs yourself and copy these files next to Editor.exe before running:",
            "  fmod.dll, fmodstudio.dll  - FMOD Engine SDK: api/core/lib/x64, api/studio/lib/x64",
            "  vaudionative.dll          - Vercidium Audio SDK: 3d/native/production/windows"
          )

      - name: Upload editor artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.configuration }}
          path: artifacts/Editor-${{ matrix.configuration }}/
          if-no-files-found: error

      # The pre-release download: the same package (editor, Resources, DotNet, sample project, no
      # licensed audio libraries) in one top-level folder.
      - name: Zip release package
        if: matrix.configuration == 'Release'
        shell: pwsh
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # From the build output: the package has no FMOD DLLs, which Editor.exe loads at startup.
          $reported = & "bin\${{ matrix.configuration }}-windows-x86_64\Editor\Editor.exe" --version
          Write-Host "Editor --version: $reported"
          if ($LASTEXITCODE -ne 0 -or "$reported" -notlike "*$env:LUX_BUILD_VERSION*") {
            throw "Editor.exe --version did not report $env:LUX_BUILD_VERSION (exit $LASTEXITCODE)"
          }

          $editor = Join-Path "artifacts" "Editor-${{ matrix.configuration }}"
          $name = "LuxEngine-$env:LUX_BUILD_VERSION-windows-x64"
          Rename-Item $editor $name
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip -mx=7 "release/$name.zip" "./artifacts/$name"
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }

      - name: Upload release package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.configuration }}
          path: logs/*.log
          if-no-files-found: ignore

  build-linux:
    needs: version
    # Vercidium Audio 1.9.0's libvaudionative.so needs glibc 2.43 (sqrtf/log10f/acosf@GLIBC_2.43),
    # which Ubuntu 24.04 (glibc 2.39) cannot link against. Ubuntu 26.04 ships glibc 2.43.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          lfs: true

      # See the Windows job: licensed audio SDKs come from a private repository.
      - name: Check audio SDK access
        shell: bash
        env:
          AUDIO_SDK_TOKEN: ${{ secrets.AUDIO_SDK_TOKEN }}
          AUDIO_SDK_REPOSITORY: ${{ vars.AUDIO_SDK_REPOSITORY }}
        run: |
          if [ -z "$AUDIO_SDK_TOKEN" ] || [ -z "$AUDIO_SDK_REPOSITORY" ]; then
            echo "::error::FMOD/Vercidium Audio SDKs are unavailable. Set the repository variable AUDIO_SDK_REPOSITORY and the secret AUDIO_SDK_TOKEN (pull requests from forks cannot read secrets)."
            exit 1
          fi

      - name: Checkout audio SDKs (private)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ vars.AUDIO_SDK_REPOSITORY }}
          token: ${{ secrets.AUDIO_SDK_TOKEN }}
          path: .audio-sdk
          persist-credentials: false

      - name: Point the build at the audio SDKs
        shell: bash
        run: |
          echo "LUX_FMOD_SDK=${GITHUB_WORKSPACE}/.audio-sdk/FMOD/linux" >> "$GITHUB_ENV"
          echo "LUX_VA_SDK=${GITHUB_WORKSPACE}/.audio-sdk/VA_RAY" >> "$GITHUB_ENV"

      # See the Windows job.
      - name: Bake the version string
        shell: bash
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '#pragma once\n#define LUX_VERSION "%s"\n' "$LUX_BUILD_VERSION" > Core/Source/Lux/Core/BuildVersion.h

      # Coral hardcodes hostfxr major version 9, and ScriptCore targets net9.0.
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # GLFW is built with both the X11 and Wayland backends and runs wayland-scanner during
      # the build (wayland-scanner lives in libwayland-bin). NFD-Extended needs GTK3 for file
      # dialogs, and backward-cpp resolves symbols through libdw/libunwind.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm make pkg-config \
            libgtk-3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols \
            libdw-dev libunwind-dev libtbb-dev zlib1g-dev zip

          # The Dist configuration compiles with -flto, and premake's clang toolset then archives
          # with llvm-ar because GNU ar cannot index LLVM bitcode. Ubuntu ships that binary
          # version-suffixed, so make sure an unversioned llvm-ar resolves on PATH.
          if ! command -v llvm-ar >/dev/null 2>&1; then
            sudo ln -sf "$(ls -1 /usr/bin/llvm-ar-* | sort -V | tail -1)" /usr/bin/llvm-ar
          fi
          llvm-ar --version | head -1

      # Sets VULKAN_SDK, which Dependencies.lua and Linux-Build.sh both honour in preference
      # to the (gitignored) vendored SDK path.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: 1.4.335.0
          optional_components: com.lunarg.vulkan.vma, com.lunarg.vulkan.debug, com.lunarg.vulkan.glm
          install_runtime: true
          cache: true
          stripdown: true

      # Single entry point: generates the C# projects, builds the managed assemblies, the
      # native engine, and the sample game's scripts.
      - name: Build
        shell: bash
        run: |
          # pipefail so a build failure is not masked by tee's exit status.
          set -o pipefail
          mkdir -p logs
          touch logs/linux-build-start
          ./scripts/Linux-Build.sh ${{ matrix.configuration }} 2>&1 \
            | tee "logs/Build-${{ matrix.configuration }}.log"

      - name: Soundwave and full audio regression checks
        if: matrix.configuration == 'Debug'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/audio/run_soundwave.py --output bin/audio-tests/soundwave
          python3 tests/audio/run.py --banks tests/audio/fixtures/banks --output bin/audio-tests/full

      - name: Upload audio verification logs
        if: always() && matrix.configuration == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: audio-verification-linux
          path: |
            bin/audio-tests/**/*.log
          if-no-files-found: ignore

      # The build script is `set -e`, but assert the artifacts exist so a step that silently
      # produces nothing cannot pass.
      - name: Verify build output
        run: |
          out="bin/${{ matrix.configuration }}-linux-x86_64"
          fail=0
          for f in "$out/Core/libCore.a" "$out/Editor/Editor" "$out/Lux-Runtime/Lux-Runtime"; do
            if [ -s "$f" ] && [ "$f" -nt logs/linux-build-start ]; then
              echo "ok   $f"
            else
              echo "MISSING, EMPTY OR STALE $f"; fail=1
            fi
          done
          exit $fail

      # Unlike Windows, the Linux build output holds only the executable, and the binary is
      # linked with RPATH $ORIGIN/lib - so the vendored shared libraries have to be bundled
      # into lib/ for the artifact to be runnable at all.
      - name: Package editor artifact
        if: matrix.configuration == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          out="bin/${{ matrix.configuration }}-linux-x86_64/Editor"
          root="artifacts/Editor-linux-${{ matrix.configuration }}"

          rm -rf "$root"
          mkdir -p "$root/lib"
          cp -a "$out/." "$root/"

          for item in LuxSampleProject Resources DotNet; do
            if [ ! -e "Editor/$item" ]; then
              echo "Editor artifact input was not found: Editor/$item" >&2
              exit 1
            fi
            cp -a "Editor/$item" "$root/"
          done

          # Drop build intermediates and asset caches that the build regenerates. Scripts/Binaries
          # is deliberately kept - it holds the sample game's compiled script assembly.
          find "$root/LuxSampleProject" -type d \
            \( -name Intermediates -o -name obj -o -name Cache \) -prune -exec rm -rf {} + 2>/dev/null || true

          # Editor state, regenerated on first run and gitignored, so absent in a clean checkout.
          for item in imgui.ini App.lsettings; do
            [ -e "Editor/$item" ] && cp -a "Editor/$item" "$root/" \
              || echo "Skipping optional editor state file (not present): Editor/$item"
          done

          # Bundle only the libraries the binary actually resolves out of our vendored
          # directories. Globbing every *.so from the Vulkan SDK pulled in ~780 MB of
          # validation layers and SPIRV tooling that the editor never loads; ldd reports the
          # full transitive closure, so filtering it keeps exactly what is needed.
          vendor_dirs=""
          for dir in "Core/vendor/assimp/bin/linux" \
                     "Core/vendor/NvidiaAftermath/lib/x64/linux" \
                     "${VULKAN_SDK:-}/lib"; do
            if [ -d "$dir" ]; then
              vendor_dirs="$vendor_dirs $(cd "$dir" && pwd)"
            fi
          done

          # So ldd can resolve the vendored libraries, which are not on the default search path.
          export LD_LIBRARY_PATH="$(echo $vendor_dirs | tr ' ' ':')"

          for lib in $(ldd "$root/Editor" | awk '$3 ~ /^\// {print $3}' | sort -u); do
            for dir in $vendor_dirs; do
              case "$lib" in
                "$dir"/*) cp -aL "$lib" "$root/lib/"; break ;;
              esac
            done
          done

          # FMOD and Vercidium Audio shared libraries must not be redistributed: artifacts on a
          # public repository are downloadable by anyone, and both EULAs forbid shipping their
          # libraries outside a game build (FMOD also forbids shipping them as part of an engine).
          # Users copy them from their own SDK downloads into lib/.
          audio_libs_regex='lib(fmod|fmodstudio|vaudionative)[^/]*\.so'
          find "$root" \( -type f -o -type l \) -regextype posix-extended -regex ".*/${audio_libs_regex}.*" \
            -print -delete | sed 's/^/Stripping licensed audio library: /'
          if find "$root" \( -type f -o -type l \) -regextype posix-extended -regex ".*/${audio_libs_regex}.*" | grep -q .; then
            echo "Licensed audio libraries remain in the artifact" >&2
            exit 1
          fi

          cat > "$root/AUDIO_LIBRARIES_REQUIRED.txt" <<'EOF'
          This build does not include the FMOD or Vercidium Audio runtime libraries (licence restrictions).
          Download the SDKs yourself and copy these files into lib/ next to the Editor binary before running:
            libfmod.so.14, libfmodstudio.so.14  - FMOD Engine SDK: api/core/lib/x86_64, api/studio/lib/x86_64
            libvaudionative.so                  - Vercidium Audio SDK: 3d/native/production/linux
          EOF

          echo "Bundled $(find "$root/lib" -type f | wc -l) shared libraries ($(du -sh "$root/lib" | cut -f1))."

          # The binary's RPATH is $ORIGIN/lib, so the bundle must resolve with no
          # LD_LIBRARY_PATH set - otherwise we would ship an artifact that only runs on a
          # machine that already has these libraries. The stripped audio libraries are the only
          # permitted gaps.
          unresolved="$(env -u LD_LIBRARY_PATH ldd "$root/Editor" | grep 'not found' | grep -Ev "$audio_libs_regex" || true)"
          if [ -n "$unresolved" ]; then
            echo "Editor artifact has unresolved libraries:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

      - name: Upload editor artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: editor-linux-${{ matrix.configuration }}
          path: artifacts/Editor-linux-${{ matrix.configuration }}/
          if-no-files-found: error

      # See the Windows job. Zipped here, not in the release job: artifacts do not keep file
      # modes, and the zip must keep the executable bit and the lib/ symlinks.
      - name: Zip release package
        if: matrix.configuration == 'Release'
        shell: bash
        env:
          LUX_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          editor="artifacts/Editor-linux-${{ matrix.configuration }}"

          # The package has no FMOD/Vercidium libraries; take them from the SDK checkout.
          audio_dirs="$(find "$GITHUB_WORKSPACE/.audio-sdk" -name 'lib*.so*' \
            \( -name 'libfmod*' -o -name 'libvaudionative*' \) -printf '%h\n' | sort -u | paste -sd:)"
          reported="$(LD_LIBRARY_PATH="$editor/lib:$audio_dirs" "$editor/Editor" --version)"
          echo "Editor --version: $reported"
          if [[ "$reported" != *"$LUX_BUILD_VERSION"* ]]; then
            echo "::error::Editor --version did not report $LUX_BUILD_VERSION"
            exit 1
          fi

          name="LuxEngine-${LUX_BUILD_VERSION}-linux-x64"
          mv "$editor" "artifacts/$name"
          mkdir -p release
          (cd artifacts && zip -r -y -q "../release/$name.zip" "$name")

      - name: Upload release package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-${{ matrix.configuration }}
          path: logs/*.log
          if-no-files-found: ignore

  # Every push to dev publishes one pre-release, v2026.N-<commit>, with both platforms' packages,
  # then deletes all but the 10 newest dev pre-releases of the series (and their tags). Never runs
  # for pull requests or other branches.
  release:
    needs: [version, build, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two quick pushes publish one after the other, so the cleanup never races a publish.
    concurrency:
      group: dev-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      SERIES: ${{ needs.version.outputs.series }}

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Publish the pre-release
        shell: bash
        run: |
          set -euo pipefail
          ls -l release
          if [ "$(find release -name '*.zip' | wc -l)" -ne 2 ]; then
            echo "::error::Expected the Windows and Linux packages in release/"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run for the same commit: replace its packages.
            gh release upload "$TAG" release/*.zip --clobber
          else
            # --notes is prepended to the generated notes.
            gh release create "$TAG" release/*.zip \
              --target "$GITHUB_SHA" \
              --prerelease \
              --generate-notes \
              --notes "Alpha: the API will change."
          fi

      - name: Delete old dev pre-releases
        shell: bash
        run: |
          set -euo pipefail
          keep=10
          # Only pre-releases tagged exactly v<series>-<7 hex>; nothing else is ever touched. A literal
          # prefix, not a regex, so the series' dot matches only a dot.
          prefix="v${SERIES}-"

          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.draft | not)) | [.created_at, .tag_name] | @tsv' \
            | awk -F '\t' -v prefix="$prefix" \
                'index($2, prefix) == 1 && substr($2, length(prefix) + 1) ~ /^[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]$/' \
            | sort -r \
            | tail -n +$((keep + 1)) \
            | cut -f2 \
            | while read -r tag; do
                echo "Deleting pre-release and tag $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
